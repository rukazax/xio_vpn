<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-label="XIO Cascade screen: device, bridge and exit with country flags and connection state">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1420"/>
      <stop offset="1" stop-color="#131c2b"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="420" height="760" rx="28" fill="url(#bg)"/>

  <text x="28" y="52" fill="#e8eef7" font-family="Segoe UI, Arial" font-size="22" font-weight="600">Каскад</text>
  <text x="28" y="76" fill="#7f8ea6" font-family="Segoe UI, Arial" font-size="13">два сервера · IPv4 → IPv6</text>

  <!-- route -->
  <g font-family="Segoe UI, Arial">
    <rect x="28" y="108" width="106" height="96" rx="16" fill="#1b2536" stroke="#2b3a52"/>
    <text x="81" y="146" fill="#e8eef7" font-size="15" text-anchor="middle">Телефон</text>
    <text x="81" y="176" font-size="26" text-anchor="middle">🇷🇺</text>

    <rect x="157" y="108" width="106" height="96" rx="16" fill="#1b2536" stroke="#2ee6a8"/>
    <text x="210" y="146" fill="#e8eef7" font-size="15" text-anchor="middle">Bridge</text>
    <text x="210" y="176" font-size="26" text-anchor="middle">🇫🇮</text>

    <rect x="286" y="108" width="106" height="96" rx="16" fill="#1b2536" stroke="#38bdf8"/>
    <text x="339" y="146" fill="#e8eef7" font-size="15" text-anchor="middle">Exit</text>
    <text x="339" y="176" font-size="26" text-anchor="middle">🇸🇪</text>

    <line x1="134" y1="156" x2="157" y2="156" stroke="url(#active)" stroke-width="4"/>
    <line x1="263" y1="156" x2="286" y2="156" stroke="url(#active)" stroke-width="4"/>
    <circle cx="146" cy="156" r="4" fill="#e8eef7"/>
    <circle cx="275" cy="156" r="4" fill="#e8eef7"/>

    <text x="28" y="232" fill="#2ee6a8" font-size="13">● устройство → bridge · подключено</text>
    <text x="28" y="254" fill="#38bdf8" font-size="13">● bridge → exit · туннель только IPv6</text>
  </g>

  <!-- status -->
  <rect x="28" y="278" width="364" height="120" rx="16" fill="#16202f" stroke="#243149"/>
  <text x="46" y="308" fill="#7f8ea6" font-family="Segoe UI, Arial" font-size="12">СОСТОЯНИЕ</text>
  <text x="46" y="336" fill="#e8eef7" font-family="Segoe UI, Arial" font-size="16">Туннель активен</text>
  <text x="46" y="362" fill="#9fb0c7" font-family="Segoe UI, Arial" font-size="13">Пинг exit: 42 мс · обновлено 12:04:31</text>
  <rect x="46" y="374" width="150" height="14" rx="7" fill="#0f1724"/>
  <rect x="46" y="374" width="128" height="14" rx="7" fill="url(#active)"/>

  <!-- switch -->
  <rect x="28" y="418" width="364" height="58" rx="14" fill="#16202f" stroke="#243149"/>
  <text x="46" y="453" fill="#e8eef7" font-family="Segoe UI, Arial" font-size="14">Раздельное туннелирование</text>
  <rect x="330" y="436" width="46" height="24" rx="12" fill="#2ee6a8"/>
  <circle cx="364" cy="448" r="9" fill="#0e1420"/>

  <!-- paywall -->
  <rect x="28" y="496" width="364" height="96" rx="16" fill="#231a2e" stroke="#5b3f7a"/>
  <text x="46" y="528" fill="#d9c6f2" font-family="Segoe UI, Arial" font-size="14">🔒 Платная функция</text>
  <text x="46" y="552" fill="#a892c4" font-family="Segoe UI, Arial" font-size="12">Требуется подписка (пока заглушка)</text>
  <rect x="46" y="562" width="150" height="0" fill="none"/>

  <rect x="28" y="608" width="364" height="56" rx="14" fill="url(#active)"/>
  <text x="210" y="643" fill="#04121b" font-family="Segoe UI, Arial" font-size="16" font-weight="700" text-anchor="middle">Активировать</text>

  <text x="28" y="710" fill="#5d6b80" font-family="Segoe UI, Arial" font-size="11">Экран один, без прокрутки: схема, состояние, подписка.</text>
</svg>
