<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#0c1119"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#e7efde}.muted{fill:#9baabc}</style><text x="64" y="76" font-size="31" font-weight="bold">Protocol camouflage and entry reachability are separate tasks</text><text x="64" y="122" font-size="22" class="muted">The ISP sees the entry IP. Camouflage does not change IP packet routing.</text><rect x="44" y="177" width="1412" height="146" rx="22" fill="#151e2a"/><text x="67" y="214" font-size="20" fill="#c0f57b">01 · Ordinary tunnel</text><rect x="68" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="213" y="275" font-size="22" text-anchor="middle">Device</text><path d="M368,268h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="418" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="563" y="275" font-size="22" text-anchor="middle">ISP</text><path d="M718,268h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="768" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="913" y="275" font-size="22" text-anchor="middle">VPS IP</text><path d="M1068,268h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="1118" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="1263" y="275" font-size="22" text-anchor="middle">Internet</text><rect x="44" y="348" width="1412" height="146" rx="22" fill="#151e2a"/><text x="67" y="385" font-size="20" fill="#ffba98">02 · HTTPS + unreachable IP</text><rect x="68" y="409" width="290" height="59" rx="12" fill="#27313e"/><text x="213" y="446" font-size="22" text-anchor="middle">Device</text><path d="M368,439h39m-10,-7 10,7 -10,7" stroke="#ffba98" stroke-width="3" fill="none"/><rect x="418" y="409" width="290" height="59" rx="12" fill="#27313e"/><text x="563" y="446" font-size="22" text-anchor="middle">IP filter</text><path d="M718,439h39m-10,-7 10,7 -10,7" stroke="#ffba98" stroke-width="3" fill="none"/><rect x="768" y="409" width="290" height="59" rx="12" fill="#27313e"/><text x="913" y="446" font-size="22" text-anchor="middle">VPS IP ×</text><path d="M1068,439h39m-10,-7 10,7 -10,7" stroke="#ffba98" stroke-width="3" fill="none"/><rect x="1118" y="409" width="290" height="59" rx="12" fill="#27313e"/><text x="1263" y="446" font-size="22" text-anchor="middle">No connection</text><rect x="44" y="519" width="1412" height="146" rx="22" fill="#151e2a"/><text x="67" y="556" font-size="20" fill="#c0f57b">03 · Reachable entry point*</text><rect x="68" y="580" width="290" height="59" rx="12" fill="#27313e"/><text x="213" y="617" font-size="22" text-anchor="middle">Device</text><path d="M368,610h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="418" y="580" width="290" height="59" rx="12" fill="#27313e"/><text x="563" y="617" font-size="22" text-anchor="middle">Entry point</text><path d="M718,610h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="768" y="580" width="290" height="59" rx="12" fill="#27313e"/><text x="913" y="617" font-size="22" text-anchor="middle">Exit VPS</text><path d="M1068,610h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="1118" y="580" width="290" height="59" rx="12" fill="#27313e"/><text x="1263" y="617" font-size="22" text-anchor="middle">Internet</text><text x="64" y="747" font-size="20" class="muted">* Architecture sketch. Entry reachability needs a local test; XIO does not provide a hosted relay.</text><text x="64" y="788" font-size="18" class="muted">XIO · 2026-10-19 · Network model, not a guarantee of country-wide access</text></svg>