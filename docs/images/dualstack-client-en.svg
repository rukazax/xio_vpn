<text x="1088.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">As configured in profile</text>
<text x="44" y="359" fill="#456a30" font-family="sans-serif" font-size="20">Optional: only for explicitly entitled accounts</text>
