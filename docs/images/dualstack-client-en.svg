<text x="176.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#19251b">Account profile</text>
<text x="176.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">Scoped account token</text>
<text x="176.0" y="466" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">No root/admin SSH keys</text>
<path d="M315 436H339" stroke="#456a30" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="348" y="378" width="264" height="118" rx="18" fill="white" stroke="#456a30" stroke-width="2"/>
<text x="480.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#19251b">HTTPS API</text>
