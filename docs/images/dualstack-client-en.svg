<rect width="1264" height="660" rx="24" fill="#f3f6ee"/>
<text x="44" y="49" fill="#19251b" font-family="sans-serif" font-size="28" font-weight="700">XIO Client: connections and scoped subclients</text>
<text x="44" y="103" fill="#456a30" font-family="sans-serif" font-size="20">Connecting to an already configured server</text>
