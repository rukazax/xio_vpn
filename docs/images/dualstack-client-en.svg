<rect x="348" y="122" width="264" height="118" rx="18" fill="white" stroke="#456a30" stroke-width="2"/>
<text x="480.0" y="154" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#19251b">A and AAAA</text>
<text x="480.0" y="182" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">Physical-network DNS</text>
<text x="480.0" y="210" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">Protected physical sockets</text>
