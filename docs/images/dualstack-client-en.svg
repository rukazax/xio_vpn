<text x="784.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">Permissions and revocation</text>
<text x="784.0" y="466" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">No local quota escalation</text>
<path d="M923 436H947" stroke="#456a30" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="956" y="378" width="264" height="118" rx="18" fill="white" stroke="#456a30" stroke-width="2"/>
<text x="1088.0" y="410" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#19251b">New subclient</text>
<text x="1088.0" y="438" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">Own VPN credentials</text>
<text x="1088.0" y="466" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="400" fill="#19251b">No parent account token</text>
<path d="M176 244V281H1058" fill="none" stroke="#7b8177" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="202" y="309" fill="#555f52" font-family="sans-serif" font-size="18">Excluded traffic → direct, if allowed by Android</text>
<text x="44" y="568" fill="#555f52" font-family="sans-serif" font-size="16">IPv6 egress requires an IPv6 route on the VPS. IPv4-only sites from an IPv6-only VPS need IPv4 egress or NAT64.</text>
<text x="44" y="599" fill="#555f52" font-family="sans-serif" font-size="16">This diagram describes implementation. Verified scenarios and remaining limits are recorded separately.</text>
</svg>
