<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#0c1119"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#e7efde}.muted{fill:#9baabc}</style><text x="64" y="76" font-size="31" font-weight="bold">Протокол и доступность точки входа — разные задачи</text><text x="64" y="122" font-size="22" class="muted">IP точки входа виден провайдеру. Маскировка не меняет маршрут IP-пакета.</text><rect x="44" y="177" width="1412" height="146" rx="22" fill="#151e2a"/><text x="67" y="214" font-size="20" fill="#c0f57b">01 · Обычный туннель</text><rect x="68" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="213" y="275" font-size="22" text-anchor="middle">Устройство</text><path d="M368,268h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="418" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="563" y="275" font-size="22" text-anchor="middle">Провайдер</text><path d="M718,268h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="768" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="913" y="275" font-size="22" text-anchor="middle">VPS IP</text><path d="M1068,268h39m-10,-7 10,7 -10,7" stroke="#c0f57b" stroke-width="3" fill="none"/><rect x="1118" y="238" width="290" height="59" rx="12" fill="#27313e"/><text x="1263" y="275" font-size="22" text-anchor="middle">Интернет</text><rect x="44" y="348" width="1412" height="146" rx="22" fill="#151e2a"/><text x="67" y="385" font-size="20" fill="#ffba98">02 · HTTPS + недоступный IP</text><rect x="68" y="409" width="290" height="59" rx="12" fill="#27313e"/><text x="213" y="446" font-size="22" text-anchor="middle">Устройство</text><path d="M368,439h39m-10,-7 10,7 -10,7" stroke="#ffba98" stroke-width="3" fill="none"/><rect x="418" y="409" width="290" height="59" rx="12" fill="#27313e"/><text x="563" y="446" font-size="22" text-anchor="middle">IP-фильтр</text><path d="M718,439h3