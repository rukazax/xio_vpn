<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-label="XIO server installation flow: from the application, one terminal command, and the web panel">
<rect width="1280" height="740" rx="26" fill="#0C1119"/>
<text x="48" y="64" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="bold" fill="#C0F57B" text-anchor="start">XIO · три способа поставить сервер</text>
<text x="48" y="102" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="18" font-weight="normal" fill="#9BAABC" text-anchor="start">все три приводят к одному результату: systemd-юниты XIO и профили xio:// для клиентов</text>
<rect x="40" y="140" width="380" height="66" rx="16" fill="#1B2735" stroke="#27313E" stroke-width="2"/>
<circle cx="74" cy="173" r="17" fill="#16211A" stroke="#2F5B38" stroke-width="2"/>
<text x="74" y="179" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="bold" fill="#C0F57B" text-anchor="middle">1</text>
<text x="104" y="168" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="18" font-weight="bold" fill="#E7EFDE" text-anchor="start">Из приложения</text>
<text x="104" y="190" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">Full XIO, по SSH</text>
<rect x="40" y="222" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="66" cy="258" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="88" y="252" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Открыть Full XIO</text>
<text x="88" y="274" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">«+» → настройка сервера</text>
<rect x="40" y="302" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="66" cy="338" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="88" y="332" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Адрес и SSH</text>
<text x="88" y="354" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">ключ или пароль, порт 22</text>
<rect x="40" y="382" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="66" cy="418" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="88" y="412" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Предпроверка</text>
<text x="88" y="434" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">ОС, x86_64, systemd, TUN, порты</text>
<rect x="40" y="462" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="66" cy="498" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="88" y="492" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Установка</text>
<text x="88" y="514" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">пакет + SHA-256, службы, юниты</text>
<rect x="40" y="542" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="66" cy="578" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="88" y="572" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Пользователи</text>
<text x="88" y="594" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">профили xio:// по транспортам</text>
<rect x="450" y="140" width="380" height="66" rx="16" fill="#1B2735" stroke="#27313E" stroke-width="2"/>
<circle cx="484" cy="173" r="17" fill="#16211A" stroke="#2F5B38" stroke-width="2"/>
<text x="484" y="179" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="bold" fill="#C0F57B" text-anchor="middle">2</text>
<text x="514" y="168" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="18" font-weight="bold" fill="#E7EFDE" text-anchor="start">Одной командой</text>
<text x="514" y="190" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">терминал на сервере, root</text>
<rect x="450" y="222" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="476" cy="258" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="498" y="252" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Скачать архив</text>
<text x="498" y="274" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">xio-server-0.24.0.tar.gz</text>
<rect x="450" y="302" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="476" cy="338" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="498" y="332" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Сверить SHA-256</text>
<text x="498" y="354" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">SHA256SUMS-0.24.0.txt</text>
<rect x="450" y="382" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="476" cy="418" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="498" y="412" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Запустить bootstrap</text>
<text x="498" y="434" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">stdin-архив или пин sha256</text>
<rect x="450" y="462" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="476" cy="498" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="498" y="492" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Проверить юниты</text>
<text x="498" y="514" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">systemctl status xio-managed-awg</text>
<rect x="450" y="542" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="476" cy="578" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="498" y="572" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Создать пользователя</text>
<text x="498" y="594" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">admin.py: init, add</text>
<rect x="860" y="140" width="380" height="66" rx="16" fill="#1B2735" stroke="#27313E" stroke-width="2"/>
<circle cx="894" cy="173" r="17" fill="#16211A" stroke="#2F5B38" stroke-width="2"/>
<text x="894" y="179" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="17" font-weight="bold" fill="#C0F57B" text-anchor="middle">3</text>
<text x="924" y="168" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="18" font-weight="bold" fill="#E7EFDE" text-anchor="start">Веб-панель</text>
<text x="924" y="190" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">server/webui, TLS + токен</text>
<rect x="860" y="222" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="886" cy="258" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="908" y="252" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">install-webui.sh</text>
<text x="908" y="274" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">127.0.0.1:10443, самоподписанный</text>
<rect x="860" y="302" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="886" cy="338" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="908" y="332" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Открыть панель</text>
<text x="908" y="354" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">https + Bearer-токен</text>
<rect x="860" y="382" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="886" cy="418" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="908" y="412" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Службы</text>
<text x="908" y="434" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">start / stop / restart</text>
<rect x="860" y="462" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="886" cy="498" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="908" y="492" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Пользователи</text>
<text x="908" y="514" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">добавить / отозвать</text>
<rect x="860" y="542" width="380" height="72" rx="12" fill="#151E2A" stroke="#27313E" stroke-width="1.6"/>
<circle cx="886" cy="578" r="9" fill="#151E2A" stroke="#C0F57B" stroke-width="2"/>
<text x="908" y="572" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E7EFDE" text-anchor="start">Каскад</text>
<text x="908" y="594" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">включить / выключить, health</text>
<text x="48" y="668" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">Где живёт код установки: server/managed/bootstrap.sh и server/managed/admin.py — в репозитории, а не только внутри приложения.</text>
<text x="48" y="692" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#9BAABC" text-anchor="start">Каскад ставится отдельно: deploy/cascade/terminal-install.sh --role bridge|exit|both (одна команда, контейнер).</text>
<text x="48" y="716" font-family="'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="normal" fill="#4E5A69" text-anchor="start">Не проверено: веб-панель и терминальный bootstrap не запускались на живом сервере с systemd и admin.py — см. server/webui/README.md.</text>
</svg>
