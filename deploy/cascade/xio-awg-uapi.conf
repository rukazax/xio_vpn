# The AmneziaWG userspace daemon exposes its UAPI socket in /run/amneziawg, while
# wg(8) looks in /run/wireguard. Recreate the bridge on every boot so `wg show
# xioawg0`, statistics and monitoring keep working after a reboot.
d /run/wireguard 0755 root root -
L+ /run/wireguard/xioawg0.sock - - - - /run/amneziawg/xioawg0.sock
