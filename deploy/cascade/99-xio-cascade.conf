# XIO cascade host settings.
# IPv6 forwarding is what the tunnel needs; XIO also enables it at runtime, but the
# runtime call is skipped when the VPN units start before the cascade route exists,
# so the setting has to survive a reboot on its own.
net.ipv6.conf.all.forwarding=1
net.ipv6.conf.default.forwarding=1
net.ipv4.ip_forward=1
