# XIO Cascade — источники белых списков (IPv4).
#
# Формат строки:
#   https://example.org/list.txt          просто URL со списком
#   ru-direct=https://example.org/ru.txt  имя=URL (имя только для логов)
#
# Внутри списков понимаются: домены (разворачиваются в IPv4 через getent),
# IPv4-адреса и IPv4-префиксы (10.0.0.0/8). Всё остальное отбрасывается,
# пустые строки и #-комментарии игнорируются.
#
# Эти URL — примеры, а не рекомендация: проверяйте источник и его актуальность.
# После правки примените вручную: ./whitelist-update.sh --config ./data/whitelists.conf

# Российские префиксы (агрегированная зона)
ru-aggregated=https://www.ipdeny.com/ipblocks/data/aggregated/ru-aggregated.zone

# Список «всё нужное» antifilter (адреса)
antifilter-allyouneed=https://antifilter.download/list/allyouneed.lst

# Домены antifilter (разворачиваются в IPv4 при обновлении)
antifilter-domains=https://antifilter.download/list/domains.lst
